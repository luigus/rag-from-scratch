<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="1500" fill="#F6F5F1"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker></defs>
<text x="45" y="85" font-size="50" fill="#1F2933" font-weight="bold" text-anchor="start">Why one search is not enough</text>
<text x="45" y="130" font-size="26" fill="#5B6670" font-weight="normal" text-anchor="start">Searching by meaning vs. searching by words</text>
<circle cx="67" cy="197" r="22" fill="#1F2933"/>
<text x="67" y="205" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="105" y="205" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Each search fails in a different way</text>
<rect x="45" y="235" width="540" height="300" rx="12" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="70" y="275" font-size="22" fill="#2457C5" font-weight="bold" text-anchor="start">Search by MEANING (vectors)</text>
<rect x="70" y="293" width="490" height="48" rx="24" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="93" y="325" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">“What is F-271?”</text>
<text x="70" y="375" font-size="17" fill="#5B6670" font-weight="bold" text-anchor="start">Top result:</text>
<rect x="70" y="388" width="490" height="62" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="90" y="426" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">F-217: door obstacle detection…</text>
<circle cx="535" cy="419" r="14" fill="#C62828"/>
<path d="M529,413 l12,12 M541,413 l-12,12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="485" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Similar meaning, wrong code.</text>
<text x="70" y="513" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">To a meaning model, F-217 ≈ F-271.</text>
<rect x="615" y="235" width="540" height="300" rx="12" fill="#FFFFFF" stroke="#C2610C" stroke-width="3"/>
<text x="640" y="275" font-size="22" fill="#C2610C" font-weight="bold" text-anchor="start">Search by WORDS (BM25)</text>
<rect x="640" y="293" width="490" height="48" rx="24" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="663" y="325" font-size="20" fill="#1F2933" font-weight="bold" text-anchor="start">“Can I take my bike on a Saturday?”</text>
<text x="640" y="375" font-size="17" fill="#5B6670" font-weight="bold" text-anchor="start">Top result:</text>
<rect x="640" y="388" width="490" height="62" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="660" y="426" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Small pets travelling in a carrier…</text>
<circle cx="1105" cy="419" r="14" fill="#C62828"/>
<path d="M1099,413 l12,12 M1111,413 l-12,12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
<text x="640" y="485" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">The rules say “bicycle” and “weekends”,</text>
<text x="640" y="513" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">not “bike” and “Saturday”: no words in common.</text>
<circle cx="67" cy="602" r="22" fill="#1F2933"/>
<text x="67" y="610" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="105" y="610" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Run both, then merge the two rankings</text>
<rect x="45" y="640" width="300" height="250" rx="12" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="195" y="678" font-size="20" fill="#2457C5" font-weight="bold" text-anchor="middle">by meaning</text>
<text x="75" y="722" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">1.</text>
<text x="110" y="722" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk A</text>
<text x="75" y="770" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">2.</text>
<text x="110" y="770" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk B</text>
<text x="75" y="818" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">3.</text>
<text x="110" y="818" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk C</text>
<rect x="375" y="640" width="300" height="250" rx="12" fill="#FFFFFF" stroke="#C2610C" stroke-width="3"/>
<text x="525" y="678" font-size="20" fill="#C2610C" font-weight="bold" text-anchor="middle">by words</text>
<text x="405" y="722" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">1.</text>
<text x="440" y="722" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk B</text>
<text x="405" y="770" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">2.</text>
<text x="440" y="770" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk D</text>
<text x="405" y="818" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">3.</text>
<text x="440" y="818" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">chunk A</text>

<path d="M680,765 L735,765" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="750" y="640" width="405" height="250" rx="12" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="952" y="678" font-size="20" fill="#0E7C6B" font-weight="bold" text-anchor="middle">merged (RRF)</text>
<text x="775" y="720" font-size="19" fill="#5B6670" font-weight="bold" text-anchor="start">1.</text>
<text x="810" y="720" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">chunk B</text>
<text x="1135" y="720" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="end">1/62 + 1/61</text>
<text x="775" y="762" font-size="19" fill="#5B6670" font-weight="bold" text-anchor="start">2.</text>
<text x="810" y="762" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">chunk A</text>
<text x="1135" y="762" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="end">1/61 + 1/63</text>
<text x="775" y="804" font-size="19" fill="#5B6670" font-weight="bold" text-anchor="start">3.</text>
<text x="810" y="804" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">chunk D</text>
<text x="1135" y="804" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="end">1/62</text>
<text x="775" y="846" font-size="19" fill="#5B6670" font-weight="bold" text-anchor="start">4.</text>
<text x="810" y="846" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">chunk C</text>
<text x="1135" y="846" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="end">1/63</text>
<rect x="45" y="905" width="1110" height="95" rx="10" fill="#FFF7E0" stroke="#E8C766" stroke-width="2"/>
<text x="70" y="940" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Each chunk gets 1 / (60 + position) from each list, and the points are added up.</text>
<text x="70" y="972" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Only positions count, so the different score scales of the two searches don’t matter.</text>
<circle cx="67" cy="1057" r="22" fill="#1F2933"/>
<text x="67" y="1065" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="105" y="1065" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Optional: a careful reader reorders the top 10</text>
<rect x="45" y="1095" width="330" height="120" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="210" y="1145" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="middle">10 merged chunks</text>
<text x="210" y="1178" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">from step 2</text>
<path d="M380,1155 L440,1155" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="455" y="1095" width="300" height="120" rx="12" fill="#1F2933" stroke="#1F2933" stroke-width="2.5"/>
<text x="605" y="1140" font-size="23" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Reranker</text>
<text x="605" y="1172" font-size="17" fill="#D7DCE1" font-weight="normal" text-anchor="middle">reads question + chunks</text>
<text x="605" y="1196" font-size="17" fill="#D7DCE1" font-weight="normal" text-anchor="middle">together</text>
<path d="M760,1155 L820,1155" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="835" y="1095" width="320" height="120" rx="12" fill="#0E7C6B" stroke="#0E7C6B" stroke-width="2.5"/>
<text x="995" y="1145" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="middle">best 3 to the LLM</text>
<text x="995" y="1178" font-size="17" fill="#E6F2EF" font-weight="normal" text-anchor="middle">in a better order</text>
<text x="45" y="1255" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">Slower and costs one more model call per question, so it has to earn its place.</text>
<rect x="45" y="1290" width="1110" height="110" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="70" y="1335" font-size="24" fill="#1F2933" font-weight="bold" text-anchor="start">Which one wins?</text>
<text x="70" y="1372" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Not a matter of opinion: the same 40-question exam runs once per strategy, and the numbers decide.</text>
<line x1="45" y1="1445" x2="1155" y2="1445" stroke="#D9D6CE" stroke-width="2"/>
<text x="45" y="1478" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">github.com/luigus/rag-from-scratch · Phase 3</text>
<text x="1155" y="1478" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="end">Examples above show how each search CAN fail.</text>
</svg>