<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="1200" fill="#F6F5F1"/>
<defs>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2457C5"/></marker>
<marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C6B"/></marker>
<marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
</defs>
<text x="45" y="95" font-size="50" font-weight="bold" fill="#1F2933">How a basic RAG works</text>
<text x="45" y="145" font-size="26" fill="#5B6670">rag-from-scratch · Phase 1 — answers grounded in your own documents</text>
<text x="45" y="235" font-size="22" font-weight="bold" fill="#2457C5" letter-spacing="2">1 · INGESTION</text>
<text x="250" y="235" font-size="20" fill="#5B6670">POST /documents</text>
<rect x="45" y="260" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="165.0" y="311.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Upload</text>
<text x="165.0" y="343.0" font-size="18" fill="#5B6670" text-anchor="middle">PDF · TXT · MD</text>
<path d="M285,315 L331,315" fill="none" stroke="#2457C5" stroke-width="3.5" marker-end="url(#arrb)"/>
<rect x="335" y="260" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="455.0" y="311.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Extract text</text>
<text x="455.0" y="343.0" font-size="18" fill="#5B6670" text-anchor="middle">pypdf</text>
<path d="M575,315 L621,315" fill="none" stroke="#2457C5" stroke-width="3.5" marker-end="url(#arrb)"/>
<rect x="625" y="260" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="745.0" y="311.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Chunking</text>
<text x="745.0" y="343.0" font-size="18" fill="#5B6670" text-anchor="middle">size + overlap</text>
<path d="M865,315 L911,315" fill="none" stroke="#2457C5" stroke-width="3.5" marker-end="url(#arrb)"/>
<rect x="915" y="260" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="1035.0" y="311.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Embeddings</text>
<text x="1035.0" y="343.0" font-size="18" fill="#5B6670" text-anchor="middle">1 vector per chunk</text>
<path d="M1035,370 L1035,520 L804,520" fill="none" stroke="#2457C5" stroke-width="3.5" marker-end="url(#arrb)"/>
<rect x="400" y="465" width="400" height="110" rx="14" fill="#1F2933" stroke="#1F2933" stroke-width="3"/>
<text x="600.0" y="516.0" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OpenSearch</text>
<text x="600.0" y="548.0" font-size="18" fill="#FFFFFF" text-anchor="middle">k-NN vector index</text>
<text x="45" y="655" font-size="22" font-weight="bold" fill="#0E7C6B" letter-spacing="2">2 · QUESTION</text>
<text x="240" y="655" font-size="20" fill="#5B6670">POST /ask</text>
<rect x="45" y="680" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="140.0" y="731.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Question</text>
<text x="140.0" y="763.0" font-size="18" fill="#5B6670" text-anchor="middle">from the user</text>
<path d="M235,735 L271,735" fill="none" stroke="#0E7C6B" stroke-width="3.5" marker-end="url(#arrt)"/>
<rect x="275" y="680" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="370.0" y="731.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Embedding</text>
<text x="370.0" y="763.0" font-size="18" fill="#5B6670" text-anchor="middle">same model</text>
<path d="M465,735 L501,735" fill="none" stroke="#0E7C6B" stroke-width="3.5" marker-end="url(#arrt)"/>
<rect x="505" y="680" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="600.0" y="731.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Search</text>
<text x="600.0" y="763.0" font-size="18" fill="#5B6670" text-anchor="middle">top-k chunks</text>
<path d="M695,735 L731,735" fill="none" stroke="#0E7C6B" stroke-width="3.5" marker-end="url(#arrt)"/>
<rect x="735" y="680" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="830.0" y="731.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">Prompt</text>
<text x="830.0" y="763.0" font-size="18" fill="#5B6670" text-anchor="middle">rules + context</text>
<path d="M925,735 L961,735" fill="none" stroke="#0E7C6B" stroke-width="3.5" marker-end="url(#arrt)"/>
<rect x="965" y="680" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="1060.0" y="731.0" font-size="25" font-weight="bold" fill="#1F2933" text-anchor="middle">LLM</text>
<text x="1060.0" y="763.0" font-size="18" fill="#5B6670" text-anchor="middle">temperature 0</text>
<path d="M600,575 L600,676" fill="none" stroke="#1F2933" stroke-width="3.5" marker-end="url(#arrd)"/>
<path d="M1060,790 L1060,876" fill="none" stroke="#0E7C6B" stroke-width="3.5" marker-end="url(#arrt)"/>
<rect x="820" y="880" width="335" height="110" rx="14" fill="#0E7C6B" stroke="#0E7C6B" stroke-width="3"/>
<text x="987.5" y="931.0" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Answer + sources</text>
<text x="987.5" y="963.0" font-size="18" fill="#FFFFFF" text-anchor="middle">cited as [1], [2]…</text>
<circle cx="55" cy="898" r="5" fill="#5B6670"/>
<text x="72" y="905" font-size="21" fill="#1F2933">No context found → no LLM call, no guessing</text>
<circle cx="55" cy="936" r="5" fill="#5B6670"/>
<text x="72" y="943" font-size="21" fill="#1F2933">Providers behind interfaces → tested with fakes</text>
<circle cx="55" cy="974" r="5" fill="#5B6670"/>
<text x="72" y="981" font-size="21" fill="#1F2933">Async end to end: FastAPI, OpenAI, OpenSearch</text>
<line x1="45" y1="1085" x2="1155" y2="1085" stroke="#D9D6CE" stroke-width="2"/>
<text x="45" y="1135" font-size="20" fill="#5B6670">Python · FastAPI · Pydantic · OpenAI · OpenSearch · Docker</text>
<text x="1155" y="1135" font-size="20" fill="#5B6670" text-anchor="end">Next: measuring answer quality →</text>
</svg>