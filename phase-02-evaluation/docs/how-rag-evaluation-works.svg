<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="1500" fill="#F6F5F1"/>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker></defs>
<text x="45" y="85" font-size="50" fill="#1F2933" font-weight="bold" text-anchor="start">Is my RAG any good?</text>
<text x="45" y="130" font-size="26" fill="#5B6670" font-weight="normal" text-anchor="start">Give it an exam, with an answer key</text>
<circle cx="67" cy="197" r="22" fill="#1F2933"/>
<text x="67" y="205" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="105" y="205" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Write an exam with an answer key</text>
<rect x="45" y="235" width="640" height="215" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="70" y="272" font-size="15" fill="#5B6670" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="70" y="302" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">When must brake pads BRK-4471 be replaced?</text>
<text x="70" y="342" font-size="15" fill="#5B6670" font-weight="bold" text-anchor="start">ANSWER KEY</text>
<text x="70" y="370" font-size="20" fill="#1F2933" font-weight="normal" text-anchor="start">When they are thinner than 7 mm.</text>
<text x="70" y="408" font-size="15" fill="#5B6670" font-weight="bold" text-anchor="start">PROOF IN THE MANUAL</text>
<text x="70" y="433" font-size="18" fill="#2457C5" font-weight="normal" text-anchor="start">“…replaced when the pad thickness is below 7 mm”</text>
<text x="720" y="265" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">25 questions of 5 kinds:</text>
<rect x="720" y="278" width="44" height="28" rx="14" fill="#2457C5"/>
<text x="742" y="299" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">8</text>
<text x="776" y="300" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">direct questions</text>
<rect x="720" y="312" width="44" height="28" rx="14" fill="#2457C5"/>
<text x="742" y="333" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">6</text>
<text x="776" y="334" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">same idea, other words</text>
<rect x="720" y="346" width="44" height="28" rx="14" fill="#2457C5"/>
<text x="742" y="367" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">5</text>
<text x="776" y="368" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">part numbers &amp; codes</text>
<rect x="720" y="380" width="44" height="28" rx="14" fill="#2457C5"/>
<text x="742" y="401" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="776" y="402" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">need two facts</text>
<rect x="720" y="414" width="44" height="28" rx="14" fill="#C2610C"/>
<text x="742" y="435" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="776" y="436" font-size="19" fill="#1F2933" font-weight="normal" text-anchor="start">no answer exists</text>
<text x="720" y="476" font-size="18" fill="#C2610C" font-weight="bold" text-anchor="start">Can it say “I don’t know”?</text>
<circle cx="67" cy="552" r="22" fill="#1F2933"/>
<text x="67" y="560" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="105" y="560" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Grade the search and the answer separately</text>
<rect x="45" y="590" width="540" height="420" rx="12" fill="#FFFFFF" stroke="#2457C5" stroke-width="3"/>
<text x="70" y="632" font-size="23" fill="#2457C5" font-weight="bold" text-anchor="start">Did it find the right pages?</text>
<text x="70" y="662" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">No AI needed: is the proof in what it found?</text>
<rect x="70" y="690" width="430" height="54" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="95" y="725" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">1</text>
<text x="125" y="725" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Bogies are serviced every…</text>
<circle cx="530" cy="717" r="15" fill="#C62828"/>
<path d="M524,711 l12,12 M536,711 l-12,12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
<rect x="70" y="760" width="430" height="54" rx="8" fill="#EEF3FC" stroke="#2457C5" stroke-width="2.5"/>
<text x="95" y="795" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">2</text>
<text x="125" y="795" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">…replaced when the pad thickness…</text>
<circle cx="530" cy="787" r="15" fill="#2E7D32"/>
<path d="M523,787 l5,6 l9,-11" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="830" width="430" height="54" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<text x="95" y="865" font-size="20" fill="#5B6670" font-weight="bold" text-anchor="start">3</text>
<text x="125" y="865" font-size="18" fill="#1F2933" font-weight="normal" text-anchor="start">Wheels are reprofiled when…</text>
<circle cx="530" cy="857" r="15" fill="#C62828"/>
<path d="M524,851 l12,12 M536,851 l-12,12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="935" font-size="19" fill="#1F2933" font-weight="bold" text-anchor="start">Found it ✓  ·  but only in 2nd place</text>
<text x="70" y="968" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">Hit · Recall · Precision · MRR</text>
<text x="70" y="994" font-size="16" fill="#5B6670" font-weight="normal" text-anchor="start">(how much was found, and how high)</text>
<rect x="615" y="590" width="540" height="420" rx="12" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/>
<text x="640" y="632" font-size="23" fill="#0E7C6B" font-weight="bold" text-anchor="start">Did it answer well?</text>
<text x="640" y="662" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">A second AI grades it, like an examiner:</text>
<rect x="640" y="690" width="490" height="120" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<circle cx="672" cy="730" r="15" fill="#2E7D32"/>
<path d="M665,730 l5,6 l9,-11" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="737" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Faithful</text>
<text x="700" y="767" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">Everything it says comes</text>
<text x="700" y="792" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">from the pages it found</text>
<rect x="640" y="825" width="490" height="120" rx="8" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="2"/>
<circle cx="672" cy="865" r="15" fill="#2E7D32"/>
<path d="M665,865 l5,6 l9,-11" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="872" font-size="21" fill="#1F2933" font-weight="bold" text-anchor="start">Correct</text>
<text x="700" y="902" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">It matches the answer key</text>
<text x="700" y="927" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">(or says “I don’t know”)</text>
<text x="640" y="972" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="start">Faithful catches invented answers,</text>
<text x="640" y="994" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="start">even the ones that happen to be right.</text>
<rect x="45" y="1030" width="1110" height="62" rx="10" fill="#FFF7E0" stroke="#E8C766" stroke-width="2"/>
<text x="70" y="1069" font-size="18" fill="#1F2933" font-weight="bold" text-anchor="start">Why separately? A wrong answer comes from a bad search or a bad answer. Now you know which to fix.</text>
<circle cx="67" cy="1152" r="22" fill="#1F2933"/>
<text x="67" y="1160" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="105" y="1160" font-size="28" fill="#1F2933" font-weight="bold" text-anchor="start">Run the exam after every change</text>
<rect x="45" y="1195" width="250" height="140" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="170" y="1245" font-size="22" fill="#1F2933" font-weight="bold" text-anchor="middle">Change</text>
<text x="170" y="1280" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">chunk size, prompt,</text>
<text x="170" y="1304" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">model, search…</text>
<path d="M297,1265 L325,1265" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="330" y="1195" width="250" height="140" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="455" y="1245" font-size="22" fill="#1F2933" font-weight="bold" text-anchor="middle">Run the exam</text>
<text x="455" y="1280" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">25 questions,</text>
<text x="455" y="1304" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">a few minutes</text>
<path d="M582,1265 L610,1265" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="615" y="1195" width="250" height="140" rx="12" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.5"/>
<text x="740" y="1245" font-size="22" fill="#1F2933" font-weight="bold" text-anchor="middle">Compare</text>
<text x="740" y="1280" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">with the last</text>
<text x="740" y="1304" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">report card</text>
<path d="M867,1265 L895,1265" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<rect x="900" y="1195" width="250" height="140" rx="12" fill="#0E7C6B" stroke="#0E7C6B" stroke-width="2.5"/>
<text x="1025" y="1245" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Keep or undo</text>
<text x="1025" y="1280" font-size="17" fill="#E6F2EF" font-weight="normal" text-anchor="middle">decided by numbers,</text>
<text x="1025" y="1304" font-size="17" fill="#E6F2EF" font-weight="normal" text-anchor="middle">not by feeling</text>
<path d="M965,1337 L965,1375 L170,1375 L170,1339" stroke="#1F2933" stroke-width="3.5" fill="none" marker-end="url(#ak)"/>
<text x="568" y="1400" font-size="17" fill="#5B6670" font-weight="normal" text-anchor="middle">repeat</text>
<line x1="45" y1="1445" x2="1155" y2="1445" stroke="#D9D6CE" stroke-width="2"/>
<text x="45" y="1478" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="start">github.com/luigus/rag-from-scratch · Phase 2</text>
<text x="1155" y="1478" font-size="18" fill="#5B6670" font-weight="normal" text-anchor="end">Without an answer key, every “improvement” is a guess.</text>
</svg>